on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get -y install qemu-user-binfmt
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: build AMD64
        run: |
          bash ./container-build.sh
          mv temper_query temper_query.amd64
      - name: build ARM64
        run: |
          bash ./container-build.sh "linux/arm64/v8"
          mv temper_query temper_query.arm64
      - name: build ARMv7 (le)
        run: |
          bash ./container-build.sh "linux/arm/v7"
          mv temper_query temper_query.armv7l
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: temper_query.*
          generate_release_notes: true
